<!-- Auto active link highlighter -->
<script>
  (function () {
    var currentPage = window.location.pathname.split("/").pop() || "index.html";
    var navLinks = document.querySelectorAll(".main-navigation .nav-link, .main-navigation .dropdown-item");
    navLinks.forEach(function (link) {
      var href = link.getAttribute("href");
      if (href && (href === currentPage || (currentPage === "" && href === "index.html"))) {
        link.classList.add("active");
        var parentDropdown = link.closest(".dropdown");
        if (parentDropdown) {
          var toggle = parentDropdown.querySelector(".dropdown-toggle");
          if (toggle) toggle.classList.add("active");
        }
      }
    });
  })();
</script>
